[project]
name = "vietnamese-legal-rag"
version = "0.1.0"
description = "A Retrieval-Augmented Generation (RAG) & Multi-Stage ReAct System for Legal Case Reasoning and Verdict Generation in Vietnamese Criminal Law"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "rag",
    "legal-ai",
    "vietnamese-law",
    "retrieval-augmented-generation",
    "vector-search",
    "llm",
    "nlp",
    "chromadb"
]
authors = [
    { name = "Hieu Jayce" }
]
dependencies = [
    "chromadb>=0.6.0",
    "google-genai>=1.0.0",
    "ipykernel>=7.2.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.30.0",
    "scipy>=1.10.0",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
rag-embed = "rag.core.embeddings:main"
rag-law-embed = "rag.core.law_embeddings:main"
rag-law-retrieve = "rag.core.law_retriever:main"
rag-generate-verdict = "rag.generation.verdict_from_eval:main"
rag-evaluate-reasoning-act = "rag.evaluation.reasoning_act_eval:main"
rag-evaluate-reasoning-one-call = "rag.evaluation.reasoning_one_call_eval:main"
rag-evaluate-reasoning-past = "rag.evaluation.reasoning_past_eval:main"
rag-combine-eval-results = "rag.evaluation.combine_eval_results:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
